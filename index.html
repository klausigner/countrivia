<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Initial Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Manifest Link -->
    <link rel="manifest" href="manifest.json">

    <!-- Fonts and Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Open Graph -->
    <meta property="og:title" content="Countrivia">
    <meta property="og:site_name" content="Countrivia">
    <meta property="og:description" content="A pixel art style country quiz game.">
    <meta property="og:image" content="https://countrivia-dusky.vercel.app/thumbnail-v5.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://countrivia-dusky.vercel.app/">

    <!-- Twitter Card (Bonus, Many Apps Reuse These) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Countrivia">
    <meta name="twitter:description" content="A pixel art style country quiz game.">
    <meta name="twitter:image" content="https://countrivia-dusky.vercel.app/thumbnail-v5.jpg">

    <!-- That’s the Text Google May Show Under Your Link in Search Results -->
    <meta name="description" content="Play Countrivia - a fun pixel art quiz game to test your knowledge of countries, flags, and landmarks.">

    <!-- Keywords -->
    <meta name="keywords" content="quiz game, country quiz, pixel art quiz, geography trivia, flag game">

    <!-- HTML Tag for Google Search Console -->
    <meta name="google-site-verification" content="SnoUtNeC5F0R1uE-y4kEWhnlN4q7c9Fk3mk5IPqVXpw">

    <!-- Favicon and Browser Title -->
    <link rel="icon" href="favicon-logo.svg" type="image/svg+xml">
    <title>Countrivia - Pixel Art Country Quiz Game</title>
</head>

<body>
    <!-- Start Game -->
    <div class="startGame">
        <div class="startGameImage">
            <p class="startGameTitle">countrivia</p>

            <div class="imageContainer">
                <img src="game-poster.webp" alt="Start Game" title="Start Game">
            </div>
        </div>

        <div class="btns">
            <button class="startGameBtn" type="button">Start Game</button>
        </div>
    </div>

    <!-- Question Card -->
    <div class="questionCard hidden">
        <div class="questionCardImage">
            <p class="questionCardTitle">question <span class="questionNumber"></span></p>

            <div class="imageContainer">
                <img class="questionImage" src="" alt="Hint" title="Hint">
            </div>
        </div>

        <p class="question"></p>

        <div class="btns">
            <button class="questionCardBtn" type="button"></button>
            <button class="questionCardBtn" type="button"></button>
        </div>
    </div>

    <!-- End Game -->
    <div class="endGame hidden">
        <div class="endGameImage">
            <p class="endGameTitle"></p>

            <div class="imageContainer">
                <img src="game-end.webp" alt="The End" title="The End">
            </div>
        </div>

        <div class="btns">
            <button class="endGameBtn" type="button">Restart Game</button>
        </div>
    </div>

    <!-- Sound During Game -->
    <audio id="duringGame">
        <source src="1-38. Goldenrod City.mp3" type="audio/mpeg">
    </audio>

    <!-- Sound After Game -->
    <audio id="afterGame">
        <source src="1-27. Victory! (Gym Leader).mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>

</html>
