<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon-logo.svg" type="image/svg+xml">
    <title>Countrivia</title>
</head>

<body>
    <!-- Start Game -->
    <div class="startGame">
        <div class="startGameImage">
            <p class="startGameTitle">countrivia</p>

            <div class="imageContainer">
                <img src="game-poster.png" alt="Start Game" title="Start Game">
            </div>
        </div>

        <div class="btns">
            <button class="startGameBtn" type="button">Start Game</button>
        </div>
    </div>

    <!-- Question Card -->
    <div class="questionCard hidden">
        <div class="questionCardImage">
            <p class="questionCardTitle">question <span class="questionNumber"></span></p>

            <div class="imageContainer">
                <img class="questionImage" src="" alt="Hint" title="Hint">
            </div>
        </div>

        <p class="question"></p>

        <div class="btns">
            <button class="questionCardBtn" type="button"></button>
            <button class="questionCardBtn" type="button"></button>
        </div>
    </div>

    <!-- End Game -->
    <div class="endGame hidden">
        <div class="endGameImage">
            <p class="endGameTitle"></p>

            <div class="imageContainer">
                <img src="game-end.png" alt="The End" title="The End">
            </div>
        </div>

        <div class="btns">
            <button class="endGameBtn" type="button">Restart Game</button>
        </div>
    </div>

    <!-- Sound During Game -->
    <audio id="duringGame">
        <source src="1-38. Goldenrod City.mp3" type="audio/mpeg">
    </audio>

    <!-- Sound After Game -->
    <audio id="afterGame">
        <source src="1-27. Victory! (Gym Leader).mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>

</html>
